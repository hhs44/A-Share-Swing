name: CI
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-free.txt pytest
      - run: python -m pytest -q
      - run: python -m ashare_swing scan --demo --asof 2026-11-04 --output reports --db data/signals.db
