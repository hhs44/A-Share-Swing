name: Free workflow verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-free.txt pytest
      - run: python -m pytest -q --junitxml=work/free-ci.xml
      - name: Real public-source smoke (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: python -m ashare_swing.free_daily --root work/free-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-workflow-verification
          path: work/
